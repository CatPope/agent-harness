# 하네스 검사 — 이 레포가 스킬의 규약과 린터를 모두 갖는다.
#
# 예전에는 규약과 린터가 doc-skills 에 있고 이 레포는 README 에서 플레이스홀더
# 경로로 가리키기만 했다. 그래서 **어느 쪽도 CI 에서 돌리지 않았다.**
# 2026-09-21 에 doc-skills 를 이 레포로 병합하면서 검사도 여기로 들여왔다.
#
# 이 레포는 스킬만 담지 않는다. 하네스(CLAUDE.md + 스킬 + 훅)와 그것을 나르는
# 매니페스트·설치기·공용 레이어가 함께 있다. 그래서 검사도 두 층이다.
#
#   1) 스킬 안쪽    포터빌리티 린터 — 남의 기계에서 깨지지 않는가
#   2) 스킬 바깥    매니페스트 정합성 — 설치기가 실제로 그것을 나르는가
#
# 2층이 없으면 스킬을 추가해 놓고 매니페스트에 안 넣는 실수를 아무도 못 잡는다.
# 린터는 통과하고, 설치처에는 그냥 없다.
name: harness-lint

on:
  push:
    paths:
      - 'skills/**'
      - 'shared/**'
      - 'workflows/**'
      - 'packs/**'
      - 'tools/**'
      - 'hooks/**'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/skill-lint.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'shared/**'
      - 'workflows/**'
      - 'packs/**'
      - 'tools/**'
      - 'hooks/**'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/skill-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 하네스 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 두 검사기 모두 표준 라이브러리만 쓴다. 3.8+ 면 어디서든 돈다.
          python-version: '3.11'

      - name: 스킬 묶음을 찾는다
        id: find
        run: |
          set -euo pipefail
          # skills/ 바로 아래의 각 묶음(_core · 워크플로우별 · 팩별)을 따로 돌린다.
          # 린터는 SKILL.md 를 가진 폴더이거나 그 부모 폴더를 받는다.
          bundles=$(find skills -mindepth 1 -maxdepth 1 -type d | sort)
          echo "발견한 묶음:"; echo "$bundles"
          echo "bundles<<EOT" >> "$GITHUB_OUTPUT"
          echo "$bundles"     >> "$GITHUB_OUTPUT"
          echo "EOT"          >> "$GITHUB_OUTPUT"

      - name: 1) 포터빌리티 린터
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            echo "::group::$b"
            python tools/check_skill.py "$b" || fail=1
            echo "::endgroup::"
          done <<< '${{ steps.find.outputs.bundles }}'
          if [ "$fail" -ne 0 ]; then
            echo "::error::포터빌리티 린터에서 FAIL 이 나왔습니다."
            exit 1
          fi
          echo "전 묶음 통과"

      - name: 2) 매니페스트 정합성
        run: |
          set -euo pipefail
          python tools/check_manifests.py || {
            echo "::error::매니페스트와 실제 폴더가 어긋납니다. 설치기가 나르지 못하는 스킬이 있습니다."
            exit 1
          }

      - name: 3) 설치기 두 벌이 같은 옵션을 받는가
        run: |
          set -euo pipefail
          # install.ps1 과 install.sh 는 짝이다. 한쪽에만 옵션이 생기면 OS 마다
          # 동작이 갈라진다 — 실제로 2026-09 에 force 동작이 갈라져 있었다.
          miss=0
          for pair in "Workflow:--workflow" "Pack:--pack" "WithLinter:--with-linter" \
                      "Force:--force" "List:--list" "Status:--status" \
                      "Project:--project" "Topic:--topic" "WithClaudeMd:--with-claude-md"; do
            ps="${pair%%:*}"; sh="${pair##*:}"
            grep -q -- "\$$ps" install.ps1 || { echo "::warning::install.ps1 에 -$ps 가 없습니다"; miss=1; }
            grep -q -- "$sh"  install.sh  || { echo "::warning::install.sh 에 $sh 가 없습니다"; miss=1; }
          done
          [ "$miss" -eq 0 ] && echo "두 설치기가 같은 옵션을 받습니다"
          exit 0

      - name: 4) 설치기에 리터럴 탭이 없는가
        run: |
          set -euo pipefail
          # 같은 자리에서 두 번 터진 버그다. PowerShell 문자열의 "...\tools" 를
          # 편집기나 스크립트가 탭으로 저장해 버리면 경로가 조용히 망가진다.
          #   61099b1     $ToolsDir 기본값의 \t 가 탭이 되어 -WithLinter 가 항상 죽었다
          #   2026-09-22  -Project 를 넣다가 같은 변수에서 재발했다
          # 사람이 두 번 놓친 자리는 규칙이 아니라 검사로 막는다.
          # 두 설치기 모두 들여쓰기에 탭을 쓰지 않으므로, 탭은 전부 사고다.
          if grep -n "$(printf '\t')" install.ps1 install.sh; then
            echo "::error::설치기에 리터럴 탭이 있습니다 — 위 줄의 \t 가 탭으로 저장됐습니다. 경로가 조용히 깨집니다."
            exit 1
          fi
          echo "리터럴 탭 없음"

      - name: 5) 훅 가드 자가 테스트
        run: |
          set -euo pipefail
          # hooks/guard.py 는 "안 읽어도 막히는" 층이다. 오탐이 생기면 사람이 훅을 꺼 버리므로
          # 막을 것과 통과할 것을 둘 다 검사한다. 리터럴 탭 검사도 그 안에 있다.
          python hooks/test_guard.py
          python hooks/test_skill_usage.py

  # 설치기 회귀 — 두 설치기를 실제로 돌려 조각 누적·멱등성·BOM·바이트 동일성을 본다.
  # ubuntu 에서는 못 돈다: tools/verify_installers.ps1 이 PowerShell 5.1 을 직접 부른다.
  # 그래서 이 job 이 없으면 "회귀 스크립트를 커밋했는데 CI 는 한 번도 안 돌린" 상태가 된다
  # (2026-09-23 적대적 검증에서 잡힘). windows 러너에는 Git Bash 와 PowerShell 5.1 이 다 있다.
  installers:
    name: 설치기 회귀 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 두 설치기 기능 검증 1~10
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_installers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 훅 가드 자가 테스트 (Windows · cp949 콘솔)
        shell: pwsh
        run: |
          # 훅 런타임과 같은 조건이다 — PYTHONIOENCODING 없이 cp949 콘솔에서 돈다.
          python hooks/test_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python hooks/test_skill_usage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
